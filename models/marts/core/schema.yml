version: 2

models:
  - name: dim_users
    description: "A dimension table for users"
    columns:
      - name: user_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: name
        description: "Name of the user"
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: email
        description: "Email address of the user"
      - name: plan
        description: "Subscription plan"
