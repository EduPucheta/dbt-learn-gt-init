version: 2

models:
  - name: dim_users
    description: "A dimension table for users"
    columns:
      - name: user_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: name
        description: "Name of the user"
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: email
        description: "Email address of the user"
      - name: plan
        description: "Subscription plan"
  - name: fact_reviews
    description: "Fact table for reviews data"
    columns:
      - name: survey_id
        description: Foreign key to surveys table
      - name: survey
        description: Type of survey (may contain null values for reviews without survey type)
      - name: rating
        description: Rating value
        tests:
          - not_null
      - name: rating_sentiment
        description: "Rating bucketed into an NPS-style label via the `rating_to_sentiment` BigQuery UDF (see macros/udfs/rating_to_sentiment.sql)"
        tests:
          - accepted_values:
              arguments:
                values: ['promoter', 'passive', 'detractor']
